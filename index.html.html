<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해봄 · 청년 첫 경력 플랫폼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style id="app-css">
/*
VOICE: 믿을 수 있는 공공 서비스 앱 — 차분하고 또렷하게
IDEA: 한 칸씩 오르는 경력 사다리, 진행 상태가 곧 화면의 중심
PICTURE: 홈의 '나의 경력 사다리' 카드와 진행률 막대
COLOUR and TYPE: 흰색·연회색 바탕, 메인 파랑(--main), 연파랑·연주황 보조 / Noto Sans KR 4단계 크기
LAYOUT: 데스크톱은 가운데 390~430px 모바일 화면, 모바일은 화면 너비 그대로
*/

/* ---------- [공통 변수] 색상은 config.js의 colors에서 자동으로 덮어씁니다 ---------- */
:root {
  color-scheme: light;
  --main: #2450D8;
  --main-soft: #E8EEFC;
  --accent-soft: #FFF1E6;
  --accent-ink: #A4480E;
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --ink: #16191F;
  --soft: #4B5260;
  --muted: #5F6672;
  --line: #E3E6EC;
  --good: #0E7A55;
  --good-soft: #E4F5EE;
  --shadow: 0 2px 10px rgba(22, 25, 31, 0.06);
  --radius: 18px;
  --radius-s: 12px;
  --gap: 16px;          /* 기본 간격 */
  --pad: 20px;          /* 화면 좌우 여백 */
  --nav-h: 68px;        /* 하단 메뉴 높이 */
  --outer: #E4E7EC;     /* 데스크톱에서 앱 바깥 배경 */
}
:root[data-theme=dark] { --outer: #1B1E24; }
@media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --outer: #1B1E24; } }

* { box-sizing: border-box; min-width: 0; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--outer);
  font: 16px/1.55 "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color: var(--ink);
  word-break: keep-all;
  overflow-wrap: anywhere;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--main); outline-offset: 2px; border-radius: 8px; }

/* ---------- 앱 틀: 데스크톱은 가운데 휴대폰 크기, 모바일은 전체 화면 ---------- */
#root { min-height: 100%; display: flex; justify-content: center; align-items: center; }
.app {
  position: relative;
  width: 100%;
  max-width: 420px;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 520px) {
  #root { padding: 24px 0; }
  .app { height: min(880px, calc(100dvh - 48px)); border-radius: 32px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); }
}
.screen { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 24px; }
.screen.with-nav { padding-bottom: calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
.screen.with-bar { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }

/* ---------- 상단 바 ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px var(--pad) 8px; }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 20px; letter-spacing: -0.5px; }
.logo-mark { width: 32px; height: 32px; border-radius: 10px; background: var(--main); display: grid; place-items: center; color: #fff; }
.detail-bar { display: flex; align-items: center; gap: 4px; padding: 12px 8px 4px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
.detail-bar h1 { font-size: 17px; margin: 0; font-weight: 700; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; position: relative; }
.icon-btn:hover { background: rgba(0,0,0,0.04); }
.dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 4px; background: #E8590C; }

/* ---------- 글자 크기 4단계 ---------- */
.h-xl { font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.5px; margin: 0; }
.h-l { font-size: 18px; line-height: 1.4; font-weight: 700; margin: 0; }
.t-m { font-size: 15px; color: var(--soft); margin: 0; }
.t-s { font-size: 13px; color: var(--muted); margin: 0; }

.section { padding: 0 var(--pad); margin-top: 24px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; gap: 8px; }
.link-btn { border: 0; background: none; color: var(--main); font-weight: 700; font-size: 14px; padding: 8px 4px; min-height: 44px; }

/* ---------- 카드 ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card + .card { margin-top: 12px; }
.card-btn { display: flex; width: 100%; text-align: left; border: 0; gap: 14px; align-items: center; }
.card-btn:hover { box-shadow: 0 4px 16px rgba(22,25,31,0.1); }
.thumb { width: 48px; height: 48px; flex-shrink: 0; border-radius: 14px; display: grid; place-items: center; background: var(--main-soft); color: var(--main); }
.thumb.warm { background: var(--accent-soft); color: var(--accent-ink); }
.grow { flex: 1; }

/* ---------- 상태 배지 ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.badge.blue { background: var(--main-soft); color: var(--main); }
.badge.warm { background: var(--accent-soft); color: var(--accent-ink); }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.gray { background: #EEF0F3; color: var(--soft); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- 사다리·진행률 ---------- */
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.step { border-radius: 14px; padding: 12px 10px; background: #F3F4F7; text-align: center; }
.step.done { background: var(--main-soft); }
.step.doing { background: var(--accent-soft); }
.step-name { font-size: 14px; font-weight: 700; display: block; }
.step-state { font-size: 12px; color: var(--muted); }
.step.done .step-state { color: var(--main); font-weight: 700; }
.step.doing .step-state { color: var(--accent-ink); font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: #E7EAF0; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--main); border-radius: 5px; transition: width .4s ease; }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

/* ---------- 버튼 ---------- */
.btn { min-height: 52px; border-radius: 14px; border: 0; padding: 0 18px; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--main); color: #fff; }
.btn.primary:disabled { background: #B9C3DD; cursor: not-allowed; }
.btn.ghost { background: #fff; border: 1px solid #D5DAE2; color: var(--ink); }
.btn.soft { background: var(--main-soft); color: var(--main); }
.btn.block { width: 100%; }
.btn.small { min-height: 44px; font-size: 14px; border-radius: 12px; }

.bottom-bar { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px var(--pad) calc(16px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.97); border-top: 1px solid var(--line); display: flex; gap: 10px; z-index: 6; }
.bottom-bar .btn.primary { flex: 1; }

/* ---------- 하단 메뉴 ---------- */
.nav { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); z-index: 6; }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; color: var(--muted); }
.nav button.on { color: var(--main); font-weight: 700; }

/* ---------- 목록·필터 ---------- */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px var(--pad) 4px; scrollbar-width: none; }
.chip { flex-shrink: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #D5DAE2; background: #fff; font-size: 14px; font-weight: 500; }
.chip.on { background: var(--main); border-color: var(--main); color: #fff; font-weight: 700; }
.meta-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.meta { background: #fff; border-radius: 14px; padding: 12px; text-align: center; box-shadow: var(--shadow); }
.meta b { display: block; font-size: 16px; }
.num-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.num-list li { display: flex; gap: 12px; font-size: 15px; line-height: 1.55; }
.num-list .n { flex-shrink: 0; width: 24px; height: 24px; border-radius: 12px; background: var(--main-soft); color: var(--main); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.demo-note { font-size: 12.5px; color: var(--muted); background: #EEF0F3; border-radius: 10px; padding: 8px 12px; margin: 0; }
.demo-flag { display: inline-flex; font-size: 12px; font-weight: 700; color: var(--accent-ink); background: var(--accent-soft); border-radius: 8px; padding: 3px 8px; }

/* ---------- 진단 ---------- */
.two-col { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.mini { border-radius: 14px; padding: 14px; }
.mini ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
.q { padding: 16px 0; border-top: 1px solid var(--line); }
.q:first-of-type { border-top: 0; padding-top: 4px; }
.q p { margin: 0 0 10px; font-size: 15px; font-weight: 500; }
.scale { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.scale button { min-height: 44px; border-radius: 12px; border: 1px solid #D5DAE2; background: #fff; font-weight: 700; }
.scale button.on { background: var(--main); border-color: var(--main); color: #fff; }
.scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.result-row { display: grid; gap: 6px; }
.result-row + .result-row { margin-top: 16px; }
.result-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }

/* ---------- 모달·토스트 ---------- */
.overlay { position: absolute; inset: 0; background: rgba(16,18,24,0.45); display: flex; align-items: flex-end; z-index: 20; }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: #fff; border-radius: 24px 24px 0 0; padding: 20px var(--pad) calc(20px + env(safe-area-inset-bottom)); }
.sheet h2 { font-size: 19px; margin: 0 0 6px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; }
textarea, .input { width: 100%; border: 1px solid #CDD3DC; border-radius: 12px; padding: 12px 14px; font-size: 16px; background: #fff; }
textarea { min-height: 120px; resize: vertical; }
.field-error { color: #B42318; font-size: 13px; margin: 6px 0 0; }
.toast { position: absolute; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translateX(-50%); background: #1F232B; color: #fff; font-size: 14px; padding: 12px 18px; border-radius: 12px; z-index: 30; width: max-content; max-width: calc(100% - 40px); text-align: center; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); font-size: 15px; cursor: pointer; }
.check:first-child { border-top: 0; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--main); flex-shrink: 0; }
.empty { text-align: center; padding: 24px 12px; color: var(--muted); font-size: 14px; }

/* ---------- 인증서 ---------- */
.cert { background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 6px 24px rgba(22,25,31,0.08); }
.cert-head { background: var(--main); color: #fff; padding: 22px 22px 20px; }
.cert-head .t-s { color: rgba(255,255,255,0.88); }
.cert-body { padding: 20px 22px; display: grid; gap: 16px; }
.grade { font-weight: 700; }
.grade.top { color: var(--main); }
.quote { background: #F4F6F9; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.6; margin: 0; }
.cert-foot { border-top: 1px dashed #CBD1DA; padding-top: 12px; font-size: 12.5px; color: var(--muted); text-align: center; }

/* ---------- 인쇄: 인증서만 깔끔하게 출력 ---------- */
@media print {
  body { background: #fff; }
  .app { height: auto; max-width: none; box-shadow: none; border-radius: 0; }
  .detail-bar, .nav, .bottom-bar, .no-print, .toast, .overlay { display: none !important; }
  .screen { overflow: visible; padding: 0 !important; }
  .cert { box-shadow: none; border: 1px solid #CBD1DA; max-width: 640px; margin: 0 auto; }
  .cert-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- [v2] 모드 전환·AI 초안 검증·기업 모드 ---------- */
.mode-btn { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #D5DAE2; background: #fff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; color: var(--soft); }
.app.company .mode-btn { border-color: var(--main); color: var(--main); }
.step-title { font-size: 16px; margin-bottom: 10px; }
.facts { background: #F6F7F9; border-radius: 12px; padding: 12px 14px; }
.facts ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.6; }
.draft-line { text-align: left; border: 1px solid #D5DAE2; background: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; display: grid; gap: 4px; min-height: 44px; }
.draft-line.on { border-color: #E8590C; background: #FFF6EF; text-decoration: line-through; text-decoration-color: #E8590C; }
.draft-line:disabled { cursor: default; color: inherit; }
.draft-line.hit { border-color: var(--good); background: var(--good-soft); text-decoration: none; }
.draft-line.miss { border-color: #E8590C; background: #FFF6EF; }
.draft-line.wrong { border-color: #B42318; background: #FEF1F0; text-decoration: none; }
.draft-note { font-size: 13px; font-weight: 700; text-decoration: none; display: block; }
.good-ink { color: var(--good); }
.warn-ink { color: #B42318; }
.ai-score { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; font-size: 15px; }
.ai-score span { display: block; font-size: 13px; font-weight: 500; margin-top: 2px; }
.ai-score.perfect { background: var(--good-soft); color: var(--good); }
.benefits { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; line-height: 1.5; color: var(--soft); }
.benefits b { display: block; color: var(--ink); font-size: 15px; }

/* ---------- [v3] 시작 화면·회원 유형 ---------- */
.start-hero { padding: 40px var(--pad) 8px; }
.role-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.role-card b { display: block; font-size: 17px; }
.role-card:hover { border-color: var(--main); }
select.input { appearance: auto; min-height: 48px; }

/* [v4] 기업 참여 사다리 · 대학 운영 현황 */
.thumb.good { background: var(--good-soft); color: var(--good); }
.steps-row { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.steps-row li { background: #fff; border-radius: 12px; padding: 10px; display: grid; gap: 2px; font-size: 13px; line-height: 1.4; border: 1px solid var(--line); word-break: keep-all; }
.steps-row li b { font-size: 14px; }
.steps-row li.on { border-color: var(--main); }
.steps-row .num { width: 22px; height: 22px; border-radius: 50%; background: #EEF0F3; color: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
.steps-row li.on .num { background: var(--main); color: #fff; }
.kpi-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: #fff; border-radius: 12px; padding: 12px; box-shadow: var(--shadow); display: grid; gap: 4px; }
.kpi b { font-size: 18px; }
.dist { display: flex; gap: 3px; margin-top: 8px; border-radius: 8px; overflow: hidden; font-size: 12px; font-weight: 700; }
.dist span { min-width: 54px; padding: 6px 8px; white-space: nowrap; }
.dist-top { background: var(--main); color: #fff; }
.dist-mid { background: var(--main-soft); color: var(--main); }
.dist-low { background: #EEF0F3; color: var(--soft); }

/* [v5] 경력 사다리 화면 — 아래에서 위로 쌓이고, 잠긴 구간은 구름에 가려짐 */
.delta { font-size: 12px; font-weight: 700; }
.delta.up { color: var(--good); }
.delta.down { color: #C2410C; }
.mini-ladder { display: grid; gap: 6px; border-left: 4px solid #B6C3DD; border-right: 4px solid #B6C3DD; padding: 6px 8px; border-radius: 4px; }
.mini-rung { background: #fff; border: 1.5px solid var(--main); border-radius: 8px; padding: 7px 10px; font-size: 13px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-rung b { color: var(--main); margin-right: 4px; }
.mini-rung.next { border-style: dashed; background: var(--main-soft); color: var(--main); font-weight: 700; }
.mini-rung.locked { border: 0; background: linear-gradient(90deg, #EEF2F8, #fff 60%, #EEF2F8); color: var(--soft); display: flex; align-items: center; gap: 6px; }
.ladder-screen { background: var(--bg); }
.ladder-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; padding: 8px var(--pad) 12px; }
.ladder-stats div { background: #fff; border-radius: 12px; padding: 10px 6px; text-align: center; display: grid; gap: 2px; box-shadow: var(--shadow); }
.ladder-stats b { font-size: 16px; color: var(--main); }
.ladder-stats span { font-size: 11.5px; color: var(--soft); }
.sky { background: linear-gradient(180deg, #CFDDF7 0%, #E4ECFA 45%, #F5F6F8 100%); padding: 6px var(--pad) 0; overflow: hidden; }
.zone { position: relative; padding: 14px 0 6px; }
.zone-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; padding: 0 2px; }
.zone-head b { font-size: 16px; }
.zone-tag { font-size: 12px; font-weight: 700; color: var(--main); background: #fff; border-radius: 999px; padding: 2px 8px; }
.rails { position: relative; display: grid; gap: 12px; padding: 12px 14px; margin-top: 8px; }
.rails::before, .rails::after { content: ""; position: absolute; top: 0; bottom: 0; width: 8px; border-radius: 4px; background: #9AAAC8; }
.rails::before { left: 0; } .rails::after { right: 0; }
.zone.locked .zone-head, .zone.locked .rails { filter: blur(4px); opacity: 0.55; }
.rung { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink);
  background: #fff; border: 2px solid var(--main); border-radius: 12px; padding: 11px 12px; box-shadow: 0 2px 0 #9AAAC8; min-height: 60px; }
.rung .grow { display: grid; gap: 2px; min-width: 0; }
.rung .grow b { font-size: 15px; line-height: 1.35; }
.rung-no { flex-shrink: 0; font-size: 12px; font-weight: 900; color: #fff; background: var(--main); border-radius: 8px; padding: 4px 7px; }
.rung.offer { border-color: var(--good); } .rung.offer .rung-no { background: var(--good); }
.rung.empty { background: rgba(255,255,255,0.55); border: 2px dashed #A9B5CB; box-shadow: none; color: var(--soft); }
.rung.empty .rung-no { background: #A9B5CB; }
.rung.next { background: var(--main-soft); border: 2px dashed var(--main); box-shadow: none; }
.rung.next .rung-no { background: var(--accent-ink); }
.rung.new { animation: rungPop 0.9s ease-out 0.5s both; }
@keyframes rungPop { 0% { transform: scale(0.6); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
.ground { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 14px 14px 0 0; padding: 14px 14px 18px; margin: 14px -2px 0; border-top: 4px solid #9AAAC8; }
.ground .grow { display: grid; gap: 2px; }
.ground .rung-no { background: #1F232B; }
